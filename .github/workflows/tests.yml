name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Node.js for syntax checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Python compilation
        run: python -m compileall -q src tests
      - name: JavaScript syntax
        run: |
          for script in src/app/static/js/*.js; do
            node --check "$script"
          done
      - name: Map library integrity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          base = Path('src/app/static/vendor')
          for package in json.loads((base / 'mapa-dependencias.json').read_text()):
              root = base / (package['package'] + '-' + package['version'])
              for entry in package['files']:
                  path = root / entry['path']
                  content = path.read_bytes()
                  if (len(content) != entry['bytes']
                          or hashlib.sha256(content).hexdigest() != entry['sha256']):
                      raise SystemExit(f'Asset divergente do manifesto: {path}')
          PY
      - name: Test suite
        run: python -m pytest -q
